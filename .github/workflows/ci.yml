name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_meeting_assistant
        ports:
          - 5432:5432
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The API enqueues on upload, so it needs Redis to boot at all.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_meeting_assistant?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-not-used-anywhere-real
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      # ffprobe is a system package, not an npm dependency. The probe tests
      # fail rather than skip when it is missing, so this step is what keeps
      # them from silently disappearing.
      - name: Install ffmpeg
        run: |
          if ! command -v ffprobe > /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1

      - run: pnpm install --frozen-lockfile

      # The client is gitignored, so nothing typechecks until it is generated.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - run: pnpm lint:ci

      - run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Rotation and reuse detection depend on PostgreSQL row locking, so this
      # is the only place that property is actually exercised.
      - name: Integration tests
        run: pnpm test:e2e

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - run: npm run build
