services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-meeting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_meeting_assistant
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_meeting_assistant']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backs the BullMQ queues. Jobs are small and replayable from the meeting
  # rows, so there is no volume here on purpose: losing this Redis loses
  # in-flight jobs, not data.
  redis:
    image: redis:7-alpine
    container_name: ai-meeting-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
